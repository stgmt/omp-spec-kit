<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body.plugin { font: 13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 10px 12px; color: #1f2328; }
  .err { color: #b42318; white-space: pre-wrap; }
  .state { font-size: 12px; color: #57606a; margin-top: 4px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 10px; border: 1px solid #d0d7de; background: #f6f8fa; }
  .badge.active { border-color: #1f883d; color: #1f883d; }
  .badge.error { border-color: #b42318; color: #b42318; }
  .badge.migrating { border-color: #9a6700; color: #9a6700; }
  code { font-family: Consolas, monospace; font-size: 12px; background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 4px; padding: 0 4px; }
  a.open { color: #3574f0; text-decoration: none; font-size: 13px; }
  a.open:hover { text-decoration: underline; }
</style>
</head>
<body class="plugin">
<div id="root" data-state="loading"></div>
<script>
  (function () {
    var root = document.getElementById('root');
    var host = null;
    // The app's own page (MAIN_MENU_ITEM) hosts all setup — this card is only
    // issue context plus the door to it.
    var APP_PAGE = '/app/spec-graph-app/spec-app';

    function escapeHtml(text) {
      return String(text == null ? '' : text).replace(/[&<>"']/g, function (ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
      });
    }

    function callService(payload) {
      return host.fetchApp('spec-handler/spec', { method: 'POST', body: payload }).then(function (response) {
        if (response && typeof response.json === 'function') return response.json();
        return response;
      });
    }

    function errorDetail(envelope) {
      var code = null;
      try {
        var parsed = JSON.parse((envelope && envelope.body) || '{}');
        code = typeof parsed.error === 'string' ? parsed.error : null;
      } catch (e) {}
      return { code: code };
    }

    async function resolveIssueId() {
      const direct = (host && (host.entity?.id || host.context?.entityId || host.entityId));
      if (direct) return direct;
      throw new Error('cannot resolve the current issue id');
    }

    function fieldText(issue, name) {
      const field = (issue.customFields || []).find(function (entry) { return entry.name === name; });
      const value = field && field.value;
      if (value === null || value === undefined) return '';
      return typeof value === 'string' ? value : (value.name || value.presentation || '');
    }

    function repoBadge(status) {
      var cls = status === 'active' ? 'active' : (status === 'error' || status === 'required') ? 'error' : status === 'migrating' ? 'migrating' : '';
      return '<span class="badge ' + cls + '" data-testid="repo-status-' + escapeHtml(status) + '">' + escapeHtml(status) + '</span>';
    }

    function openLink(extra) {
      return '<a class="open" data-testid="spec-app-link" target="_top" href="'
        + APP_PAGE + (extra || '') + '">Open Spec Service</a>';
    }

    function renderCard(opts) {
      var html = '<div class="row" data-testid="spec-context">';
      html += '<b>Spec Service</b>';
      if (opts.linkedSpec) {
        html += '<span class="state" style="margin-top:0">spec <code data-testid="linked-spec">' + escapeHtml(opts.linkedSpec) + '</code>'
          + (opts.specKnown ? ' ' + '<span class="badge active" data-testid="linked-spec-status">served</span>' : '') + '</span>';
      }
      for (var i = 0; i < (opts.repos || []).length; i++) {
        var r = opts.repos[i];
        html += '<span class="state" style="margin-top:0" data-testid="repo-chip">' + escapeHtml(r.project)
          + ' ' + repoBadge(r.status) + '</span>';
      }
      html += openLink(opts.noAccess ? '' : '?step=agent');
      html += '</div>';
      if (opts.noAccess) {
        html += '<p class="state" data-testid="no-access">No spec scopes on your account — an administrator adds you to a scope group.</p>';
      } else if (!opts.linkedSpec) {
        html += '<p class="state" data-testid="no-linked-spec">No spec linked to this issue — linked specs and the agent setup live on the Spec Service page.</p>';
      }
      root.innerHTML = html;
      root.setAttribute('data-state', 'ready');
    }

    function renderEmpty() {
      // Not configured / not signed in / service down — stay silent on the
      // issue rather than impersonating a broken task.
      root.innerHTML = '';
      root.setAttribute('data-state', 'empty');
    }

    YTApp.register().then(async function (registered) {
      host = registered;
      var results = await Promise.all([
        callService({ id: 'widget-me', method: 'service/me', params: {} }),
        callService({ id: 'widget-list', method: 'tools/call', params: { name: 'spec_catalog', arguments: { view: 'specs' } } }).catch(function () { return null; })
      ]);
      var me = results[0];
      if (errorDetail(me).code === 'NO_SCOPES' || (me && me.scopes && me.scopes.length === 0)) {
        renderCard({ noAccess: true });
        return;
      }
      if (!me || me.error || !me.login) { renderEmpty(); return; }

      var structured = results[1] && results[1].result ? results[1].result.structuredContent : results[1];
      var specs = (structured && structured.data && structured.data.specs) || [];

      var linkedSpec = '';
      try {
        var issueId = await resolveIssueId();
        var issue = await host.fetchYouTrack(
          'issues/' + encodeURIComponent(issueId) +
          '?fields=idReadable,customFields(name,value(name,presentation))');
        var specId = fieldText(issue, 'SpecId');
        linkedSpec = specId ? specId.split(':')[0] : '';
      } catch (e) {}

      renderCard({
        linkedSpec: linkedSpec,
        specKnown: linkedSpec ? specs.indexOf(linkedSpec) !== -1 : false,
        repos: me.repos || [],
        noAccess: false
      });
    }).catch(function () {
      renderEmpty();
    });
  })();
</script>
</body>
</html>
