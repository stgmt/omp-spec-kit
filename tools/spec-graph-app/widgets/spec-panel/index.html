<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body.plugin { font: 13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 12px; color: #1f2328; }
  h3 { margin: 0 0 8px; font-size: 14px; }
  .err { color: #b42318; white-space: pre-wrap; }
  .group { margin: 10px 0; }
  .group > .t { font-weight: 600; margin-bottom: 4px; }
  .node { display: block; padding: 4px 8px; margin: 2px 0; border: 1px solid #d0d7de; border-radius: 6px; text-decoration: none; color: #1f2328; background: #f6f8fa; }
  .node:hover { background: #eaeef2; }
  .node .id { font-family: Consolas, monospace; font-size: 12px; color: #57606a; }
  .btns { margin-top: 10px; display: flex; gap: 8px; }
  button { padding: 6px 14px; border-radius: 6px; border: 1px solid #1f883d; background: #1f883d; color: #fff; cursor: pointer; font-size: 13px; }
  button.secondary { background: #fff; color: #1f2328; border-color: #d0d7de; }
  button:disabled { opacity: .5; cursor: default; }
  .state { font-size: 12px; color: #57606a; margin-top: 8px; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 10px; background: #1f2328; color: #fff; font-size: 11px; font-weight: 600; }
  .trace { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body class="plugin">
<div id="root"><p class="state">Loading spec neighbors…</p></div>
<script type="module">
  const root = document.getElementById('root');
  const SNAPSHOT_PREFIX = 'SPEC-SYNC-STATE\n';
  const KIND_LABELS = {
    FUNCTIONAL_REQUIREMENT: 'FR',
    NON_FUNCTIONAL_REQUIREMENT: 'NFR',
    ACCEPTANCE_CRITERION: 'AC',
    TASK: 'TASK',
    SCENARIO: 'SCENARIO',
    ROADMAP: 'ROADMAP'
  };
  const EDGE_LABELS = {
    REFS: 'ссылается на',
    IMPLEMENTS: 'реализует',
    TESTED_BY: 'проверяется сценарием',
    DECLARES: 'объявляет',
    DEPENDS_ON: 'зависит от',
    CONTAINS: 'содержит'
  };

  const showError = (message) => {
    root.innerHTML = '<p class="err"></p>';
    root.firstChild.textContent = String(message);
  };

  function escapeHtml(text) {
    return String(text ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }

  function fieldText(issue, name) {
    const field = (issue.customFields || []).find((entry) => entry.name === name);
    if (!field || field.value === null || field.value === undefined) return '';
    if (typeof field.value === 'string') return field.value;
    return field.value.name || field.value.presentation || '';
  }

  function issueUrl(idReadable) {
    return '/issue/' + encodeURIComponent(idReadable);
  }

  async function resolveIssueId(host) {
    const ytApp = (typeof YTApp !== 'undefined') ? YTApp : null;
    const direct = (ytApp && ytApp.entity && ytApp.entity.id) || (host && (host.entity?.id || host.context?.entityId || host.entityId));
    if (direct) return direct;
    const params = new URLSearchParams(location.search);
    for (const key of ['issueId', 'issue', 'id']) {
      const value = params.get(key);
      if (value) return value;
    }
    const hash = (location.hash || '').match(/([A-Z]+-\d+|\d+-\d+)/);
    if (hash) return hash[1];
    throw new Error('cannot resolve the current issue id');
  }

  function specIdFieldValue(issue) {
    const field = (issue.customFields || []).find(f => f.name === 'SpecId');
    const value = field && field.value;
    if (typeof value === 'string') return value;
    return (value && (value.text || value.name)) || '';
  }

  async function loadCommittedSnapshot(host) {
    const query = 'project: SPEC and summary: {SPEC:SYNC-STATE}';
    const rows = await host.fetchYouTrack(
      'issues?query=' + encodeURIComponent(query) +
      '&fields=id,summary,description,customFields(name,value(name,text))&$top=50'
    );
    // The sync selects pointer issues by the SpecId custom field, not the
    // summary — a summary-only lookalike is invisible to it, so the widget
    // must apply the same gate or a forged card could outrank the real one.
    const pointer = (Array.isArray(rows) ? rows : [])
      .filter(issue => specIdFieldValue(issue) === 'SPEC:SYNC-STATE')
      .sort((a, b) => String(a.id).localeCompare(String(b.id), undefined, { numeric: true }))[0] || null;
    if (!pointer || typeof pointer.description !== 'string') throw new Error('committed SPEC snapshot is missing');
    if (!pointer.description.startsWith(SNAPSHOT_PREFIX)) throw new Error('committed SPEC snapshot marker is invalid');
    let marker;
    try {
      marker = JSON.parse(pointer.description.slice(SNAPSHOT_PREFIX.length));
    } catch {
      throw new Error('committed SPEC snapshot is not valid JSON');
    }
    const snapshot = marker && marker.snapshot;
    if (
      marker.schemaVersion !== 'BoardSnapshotV1' ||
      marker.complete !== true ||
      snapshot?.schemaVersion !== 'BoardSnapshotV1' ||
      snapshot.complete !== true ||
      snapshot.page !== null ||
      !Array.isArray(snapshot.nodes) ||
      !Array.isArray(snapshot.edges)
    ) throw new Error('committed SPEC snapshot is incomplete');
    return { marker, snapshot };
  }

  function kindLabel(kind) {
    return KIND_LABELS[kind] || kind || 'SPEC';
  }

  function nodeLink(node, cardIds, currentIssueId) {
    const trackerId = cardIds[node.canonicalId] || (node.canonicalId === node.specId ? currentIssueId : '');
    const label = escapeHtml(node.localId || node.canonicalId);
    const title = escapeHtml(node.title || '');
    if (!trackerId) return '<span class="node"><span class="id">' + label + '</span> ' + title + '</span>';
    return '<a class="node" target="_blank" rel="noreferrer" href="' + issueUrl(trackerId) + '"><span class="id">' + label + '</span> ' + title + '</a>';
  }

  function renderGroup(title, rows, cardIds, currentIssueId) {
    if (rows.length === 0) return '';
    let html = '<div class="group"><div class="t">' + escapeHtml(title) + '</div>';
    for (const row of rows) {
      html += '<div class="trace">' + nodeLink(row.node, cardIds, currentIssueId) +
        '<span class="state">' + escapeHtml(EDGE_LABELS[row.edge.type] || row.edge.type) + '</span></div>';
    }
    return html + '</div>';
  }

  function renderTrace(node, nodesById, edges, cardIds, currentIssueId) {
    const requirement = edges
      .filter((edge) => edge.from === node.canonicalId || edge.to === node.canonicalId)
      .map((edge) => ({ edge, id: edge.from === node.canonicalId ? edge.to : edge.from }))
      .map(({ edge, id }) => ({ edge, node: nodesById.get(id) }))
      .find(({ node: candidate }) => candidate?.kind === 'FUNCTIONAL_REQUIREMENT');
    if (!requirement) return '';
    return '<div class="group"><div class="t">Trace to requirement</div><div class="trace"><span class="chip">SPEC</span> → ' +
      nodeLink(requirement.node, cardIds, currentIssueId) + '</div></div>';
  }

  async function main() {
    let host;
    try {
      host = await YTApp.register();
    } catch (error) {
      showError('Spec Panel: widget host unavailable: ' + error.message);
      return;
    }

    let issueId;
    try {
      issueId = await resolveIssueId(host);
    } catch (error) {
      showError('Spec Panel: ' + error.message);
      return;
    }

    let issue;
    let committed;
    try {
      [issue, committed] = await Promise.all([
        host.fetchYouTrack(
          'issues/' + encodeURIComponent(issueId) +
          '?fields=id,idReadable,summary,resolved,customFields(name,value(name,presentation))'
        ),
        loadCommittedSnapshot(host)
      ]);
    } catch (error) {
      showError('Spec Panel: cannot load committed snapshot or current issue: ' + error.message);
      return;
    }

    const specId = fieldText(issue, 'SpecId');
    const node = committed.snapshot.nodes.find((entry) => entry.canonicalId === specId);
    if (!node) {
      showError('Spec Panel: current issue is not present in the committed snapshot.');
      return;
    }
    const nodesById = new Map(committed.snapshot.nodes.map((entry) => [entry.canonicalId, entry]));
    const cardIds = committed.marker.cardIds || {};
    const outgoing = committed.snapshot.edges
      .filter((edge) => edge.from === specId)
      .map((edge) => ({ edge, node: nodesById.get(edge.to) }))
      .filter((entry) => entry.node);
    const incoming = committed.snapshot.edges
      .filter((edge) => edge.to === specId)
      .map((edge) => ({ edge, node: nodesById.get(edge.from) }))
      .filter((entry) => entry.node);
    const state = fieldText(issue, 'State') || (node.kind === 'TASK' ? 'Open' : 'Tracked');
    const label = kindLabel(node.kind);
    let html = '<h3><span class="chip">' + escapeHtml(label) + '</span> ' +
      escapeHtml(node.title || issue.summary || issueId) + ' <span class="id">' + escapeHtml(state) + '</span></h3>';
    html += renderGroup('Outgoing', outgoing, cardIds, issueId);
    html += renderGroup('Incoming', incoming, cardIds, issueId);
    html += renderTrace(node, nodesById, committed.snapshot.edges, cardIds, issueId);
    if (outgoing.length === 0 && incoming.length === 0) html += '<p class="state">No spec links on this issue.</p>';
    html += '<div class="btns">';
    if (node.kind === 'TASK') {
      const transitions = [
        { button: 'Approve', from: 'Open', to: 'Fixed' },
        { button: 'Verify', from: 'Fixed', to: 'Verified' },
        { button: 'Reopen', from: '*', to: 'Reopened' }
      ];
      for (const transition of transitions) {
        if (transition.to === state) continue;
        if (transition.from !== '*' && transition.from !== state) continue;
        const cls = transition.button === 'Reopen' ? ' class="secondary"' : '';
        html += '<button' + cls + ' data-state="' + transition.to + '">' + transition.button + '</button>';
      }
    }
    html += '</div><p class="state" id="msg"></p>';
    root.innerHTML = html;
    const msg = document.getElementById('msg');
    for (const button of root.querySelectorAll('button[data-state]')) {
      button.addEventListener('click', async () => {
        button.disabled = true;
        msg.textContent = 'Applying State ' + button.dataset.state + '…';
        try {
          await host.fetchYouTrack('commands', {
            method: 'POST',
            body: { query: 'State ' + button.dataset.state, issues: [{ id: issue.id }], silent: true }
          });
          msg.textContent = 'State ' + button.dataset.state + ' applied. The tracker callback writes it back to the spec.';
        } catch (error) {
          msg.textContent = 'Failed: ' + error.message;
          button.disabled = false;
        }
      });
    }
  }

  main().catch((error) => showError('Spec Panel: ' + error.message));
</script>
</body>
</html>
