# Live auth E2E contour (TASK-12) — real services, no mocks.
# Project: spec-auth-e2e   (docker compose -p spec-auth-e2e ...)
#
# youtrack   : real YouTrack (Configuration Wizard completed once per volume,
#              automatically, by tests/e2e/run-live.mjs via the browser).
# spec-git   : real bare specs repo + git daemon (in-network only).
# spec-registryd : the service under test; auth points at the compose YouTrack.
#
# Host ports are deliberately offset (8081/8643) so the stack never collides
# with a developer's own YouTrack (8080) or service (8642).

services:
  youtrack:
    image: jetbrains/youtrack:2025.3.161254
    restart: unless-stopped
    environment:
      YOUTRACK_JVM_OPTS: "-Xmx1g"
    volumes:
      - yt-data:/opt/youtrack/data
      - yt-conf:/opt/youtrack/conf
      - yt-logs:/opt/youtrack/logs
      - yt-backups:/opt/youtrack/backups
    ports:
      - "127.0.0.1:8081:8080"

  spec-git:
    build:
      context: ../..
      dockerfile: deploy/git/Dockerfile
    image: spec-git:local
    restart: unless-stopped
    volumes:
      - git-data:/srv/git
    ports:
      # published only for the test runner's fixture seeding (host-side clone)
      - "127.0.0.1:9418:9418"

  spec-registryd:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    image: spec-registryd:local
    restart: unless-stopped
    environment:
      SPEC_REGISTRY_CONFIG: /data/config/projects.json
      SPEC_REGISTRY_CLONE: /data/specs-clone
      SPEC_REGISTRY_STORE: /data/registry.db
      SPEC_REGISTRY_SYNC_MS: "5000"
      SPEC_REGISTRY_AUTH_CACHE_MS: "1000"
      SPEC_REGISTRY_BOT_NAME: spec-registryd bot
      SPEC_REGISTRY_BOT_EMAIL: bot@spec-registryd.invalid
      # Optional operator credential for a private specs repo (empty in the
      # local bare-repo fixture — the git daemon needs no auth).
      SPEC_REGISTRY_GIT_TOKEN: ${SPEC_REGISTRY_GIT_TOKEN:-}
      SPEC_REGISTRY_GIT_USER: ${SPEC_REGISTRY_GIT_USER:-x-access-token}
      SPEC_REGISTRY_GIT_AUTH_URL: ${SPEC_REGISTRY_GIT_AUTH_URL:-}
    volumes:
      - service-data:/data
      - type: bind
        source: ${SPEC_AUTH_E2E_CONFIG:?set SPEC_AUTH_E2E_CONFIG to the generated projects.json}
        target: /data/config/projects.json
        read_only: true
    ports:
      - "127.0.0.1:8643:8642"

volumes:
  yt-data:
  yt-conf:
  yt-logs:
  yt-backups:
  git-data:
  service-data:
