# spec-stack-setup demo contour — one YouTrack is BOTH the identity provider
# and the tenant (operator == customer), so the stack is exactly three
# services and `docker compose up -d` brings up all of it.
#
#   youtrack        : the demo YouTrack — admin installs the app here.
#   spec-git        : bare specs repo + git daemon (auto-creates specs.git).
#   spec-registryd  : the spec registry service; its config is generated by
#                     setup.mjs after the YouTrack wizard (it needs a real
#                     service token), so registryd starts in phase 2.
#
# Host ports are 8089/9419/8644 — deliberately clear of the e2e stack
# (8081/8082/9418/8643) so both can run side by side.

name: spec-demo

services:
  youtrack:
    image: jetbrains/youtrack:2025.3.161254
    restart: unless-stopped
    environment:
      YOUTRACK_JVM_OPTS: "-Xmx1g"
    volumes:
      - yt-data:/opt/youtrack/data
      - yt-conf:/opt/youtrack/conf
      - yt-logs:/opt/youtrack/logs
      - yt-backups:/opt/youtrack/backups
    ports:
      - "127.0.0.1:8089:8080"

  spec-git:
    build:
      context: ../..
      dockerfile: deploy/git/Dockerfile
    image: spec-git:local
    restart: unless-stopped
    volumes:
      - git-data:/srv/git
    ports:
      # published for host-side inspection; the service reaches it in-network
      - "127.0.0.1:9419:9418"

  spec-registryd:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    image: spec-registryd:local
    restart: unless-stopped
    environment:
      SPEC_REGISTRY_CONFIG: /data/config/projects.json
      SPEC_REGISTRY_CLONE: /data/specs-clone
      SPEC_REGISTRY_STORE: /data/registry.db
      SPEC_REGISTRY_SYNC_MS: "5000"
      SPEC_REGISTRY_AUTH_CACHE_MS: "1000"
      # Service-side tracker projection: every accepted commit (service write
      # or reconciled remote move) re-projects cards + the board snapshot into
      # the SPEC project — no manual spec-graph-sync run needed.
      SPEC_REGISTRY_PROJECTION: "1"
      SPEC_REGISTRY_YT_PROJECT: "SPEC"
      # Marker-signing secret shared with any manual spec-graph-sync run;
      # demo default only - production deployments set a real key.
      SPEC_SYNC_MARKER_KEY: ${SPEC_SYNC_MARKER_KEY:-demo-projection-marker-key-not-for-production}
      SPEC_REGISTRY_BOT_NAME: spec-registryd bot
      SPEC_REGISTRY_BOT_EMAIL: bot@spec-registryd.invalid
      SPEC_REGISTRY_GIT_TOKEN: ${SPEC_REGISTRY_GIT_TOKEN:-}
      SPEC_REGISTRY_GIT_USER: ${SPEC_REGISTRY_GIT_USER:-x-access-token}
      SPEC_REGISTRY_GIT_AUTH_URL: ${SPEC_REGISTRY_GIT_AUTH_URL:-}
      # Demo-contour default only — production deployments set a real key.
      SPEC_REGISTRY_SECRETS_KEY: ${SPEC_REGISTRY_SECRETS_KEY:-demo-local-secrets-key-not-for-production}
    volumes:
      - service-data:/data
      - type: bind
        source: ./runtime/projects.json
        target: /data/config/projects.json
        read_only: true
    ports:
      - "127.0.0.1:8644:8642"

  # Optional tracker->spec writeback listener (docker compose --profile
  # writeback up -d). The YouTrack spec-writeback rule POSTs card state
  # changes to http://spec-listener:8787/writeback; the listener re-verifies
  # the card against the tracker and routes spec_patch through the registry's
  # /mcp write path (bot commit + push), so the next projection does not
  # revert the card. SPEC_SYNC_MARKER_KEY must equal the service's value or
  # ownership verification fails on every event.
  spec-listener:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    image: spec-registryd:local
    profiles: ["writeback"]
    restart: unless-stopped
    depends_on:
      - spec-registryd
      - youtrack
    # --bind 0.0.0.0: the default 127.0.0.1 is the CONTAINER's loopback and
    # would refuse YouTrack's POSTs from the compose network; the auth
    # boundary here is SPEC_WRITEBACK_TOKEN, not the bind address.
    command: ["node", "scripts/spec-graph-sync.mjs", "--serve", "--port", "8787", "--bind", "0.0.0.0", "--host", "http://youtrack:8080"]
    environment:
      YOUTRACK_TOKEN: ${YOUTRACK_TOKEN:?spec-listener needs a YouTrack admin token to re-verify cards}
      # Listener -> registry write path: spec_patch goes through /mcp as a
      # real commit+push. SPEC_AGENT_TOKEN is an onboarding-issued agent token
      # scoped to the spec projects (minted by spec-stack-setup).
      SPEC_REGISTRY_URL: http://spec-registryd:8642
      SPEC_AGENT_TOKEN: ${SPEC_AGENT_TOKEN:?spec-listener needs an agent token for spec_patch}
      SPEC_WRITEBACK_TOKEN: ${SPEC_WRITEBACK_TOKEN:?set and mirror in the tracker rule LISTENER_TOKEN}
      # No default on the verifier side: the listener authenticates marker
      # signatures with this key, so a committed weak default would accept a
      # forged pointer. Set it explicitly and keep it equal to the service's.
      SPEC_SYNC_MARKER_KEY: ${SPEC_SYNC_MARKER_KEY:?spec-listener must verify markers with the service's SPEC_SYNC_MARKER_KEY}
      SPEC_SYNC_SWEEP_INTERVAL_MS: ${SPEC_SYNC_SWEEP_INTERVAL_MS:-300000}

volumes:
  yt-data:
  yt-conf:
  yt-logs:
  yt-backups:
  git-data:
  service-data:
