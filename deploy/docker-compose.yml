# spec-registryd compose stack (TASK-11 / FR-15 / AC-7).
#
# Clean-host boot needs exactly three things on the host:
#   1. project config:      a projects.json (see config/projects.example.json)
#                           with specsRepo URL + tenants — path in
#                           SPEC_REGISTRY_CONFIG_PATH
#   2. specs-repo access:   the repo URL in that config must be reachable from
#                           the container (for the local AC-7 run: a host path
#                           mounted read-only at /data/remote/specs.git)
#   3. service token:       a tenants entry in that config (bearer token)
# Bot identity comes from env (SPEC_REGISTRY_BOT_NAME / _EMAIL).
#
# TLS: the endpoint serves external YouTrack instances, so production traffic
# goes through the `proxy` profile (nginx TLS termination):
#   docker compose --profile proxy up -d
# Certificates are operator-provided: deploy/proxy/certs/{fullchain,privkey}.pem
#
# youtrack-sync (existing status-sweep projection) joins the stack with
# TASK-8 — the sweep has no standalone entrypoint yet; the compose key is
# intentionally absent rather than stubbed.

services:
  spec-registryd:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: spec-registryd:local
    restart: unless-stopped
    environment:
      SPEC_REGISTRY_CONFIG: /data/config/projects.json
      SPEC_REGISTRY_CLONE: /data/specs-clone
      SPEC_REGISTRY_STORE: /data/registry.db
      SPEC_REGISTRY_SYNC_MS: ${SPEC_REGISTRY_SYNC_MS:-30000}
      SPEC_REGISTRY_BOT_NAME: ${SPEC_REGISTRY_BOT_NAME:-spec-registryd bot}
      SPEC_REGISTRY_BOT_EMAIL: ${SPEC_REGISTRY_BOT_EMAIL:-bot@spec-registryd.invalid}
    volumes:
      - registry-data:/data
      - type: bind
        source: ${SPEC_REGISTRY_CONFIG_PATH:?set SPEC_REGISTRY_CONFIG_PATH to the host projects.json}
        target: /data/config/projects.json
        read_only: true
      - ${SPEC_REGISTRY_REPO_PATH:+${SPEC_REGISTRY_REPO_PATH}:/data/remote/specs.git}
    ports:
      # direct access is loopback-only; external clients go through the proxy
      - "127.0.0.1:8642:8642"

  proxy:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      - spec-registryd
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy/certs:/etc/nginx/certs:ro
    ports:
      - "443:443"

volumes:
  registry-data:
