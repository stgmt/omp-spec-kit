# TLS termination for spec-registryd (FR-15: TLS required — the endpoint is
# reachable beyond localhost). Certificates are operator-provided:
#   deploy/proxy/certs/fullchain.pem
#   deploy/proxy/certs/privkey.pem
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # MCP Streamable HTTP: JSON responses over POST /mcp; no SSE streaming is
    # used by the service, but keep buffering off so error envelopes flush.
    location / {
        proxy_pass         http://spec-registryd:8642;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Authorization $http_authorization;
        proxy_set_header   X-Spec-Author $http_x_spec_author;
        proxy_buffering    off;
        proxy_read_timeout 120s;
    }
}
