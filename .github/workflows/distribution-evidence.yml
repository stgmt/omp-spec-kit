name: distribution-evidence

on:
  push:
    tags:
      - "v*.*.*"
  # workflow_dispatch works for (re)attesting any existing vX.Y.Z tag: the
  # release workflow discovers runs by the peeled tag commit, not by branch
  # name, so dispatched runs are picked up like tag-push runs.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attest (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: distribution-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  attest-distribution-evidence:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Verify frozen corpus provenance before evidence capture
        run: |
          if command -v node >/dev/null 2>&1; then
            NODE_BIN=node
          elif command -v node.exe >/dev/null 2>&1; then
            NODE_BIN=node.exe
          else
            echo "Node.js is required to verify the frozen corpus fixture." >&2
            exit 2
          fi
          "$NODE_BIN" scripts/refresh-real-corpus-manifest.mjs --check
          "$NODE_BIN" scripts/refresh-authoring-real-corpus-manifest.mjs --check

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install the pinned OMP discovery runtime
        run: cd tests/fixtures/omp-discovery-runtime && bun install --frozen-lockfile --ignore-scripts --no-progress

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - run: npm run build

      - name: Verify marketplace and package
        run: |
          node scripts/verify-marketplace.mjs && touch .omp-spec-kit-marketplace-ok
          node scripts/verify-package.mjs && touch .omp-spec-kit-package-ok
      - name: Capture live OMP 18.0.11 manager handoff
        env:
          DISCOVERY_PROJECT: ${{ runner.temp }}/omp-discovery-v18.0.11
          DISCOVERY_HOME: ${{ runner.temp }}/omp-discovery-home-v18.0.11
        run: |
          set -euo pipefail
          mkdir -p "$DISCOVERY_PROJECT/.specs" "$DISCOVERY_HOME" "$GITHUB_WORKSPACE/dist-evidence/mri-discovery"
          cp -r tests/fixtures/kernel/authoring-real-corpus/.specs/. "$DISCOVERY_PROJECT/.specs/"
          dist_manifest_sha="$(sha256sum plugins/omp-spec-kit/dist/manifest.json | cut -d ' ' -f1)"
          launcher_sha="$(sha256sum plugins/omp-spec-kit/bin/omp-spec-kit-mcp | cut -d ' ' -f1)"
          cd "$DISCOVERY_PROJECT"
          HOME="$DISCOVERY_HOME" USERPROFILE="$DISCOVERY_HOME" PI_CONFIG_DIR=.omp-discovery-producer OMP_PROFILE=discovery-producer \
            bun "$GITHUB_WORKSPACE/scripts/probe-omp-discovery-v18.0.11.mjs" \
            --runtime-root "$GITHUB_WORKSPACE/tests/fixtures/omp-discovery-runtime/node_modules/@oh-my-pi/pi-coding-agent" \
            --cwd "$DISCOVERY_PROJECT" \
            --package-root "$GITHUB_WORKSPACE/plugins/omp-spec-kit" \
            --phase-mode bounded \
            --phase-timeout-ms 30000 \
            --expected-dist-manifest-sha256 "$dist_manifest_sha" \
            --expected-launcher-sha256 "$launcher_sha" \
            > "$GITHUB_WORKSPACE/dist-evidence/mri-discovery/omp-discovery-v18.0.11.json"
          {
            echo '# OMP 18.0.11 discovery receipt'
            echo
            echo 'Captured by the tagged distribution-evidence workflow; the JSON below is the producer output.'
            echo
            echo '```json'
            cat "$GITHUB_WORKSPACE/dist-evidence/mri-discovery/omp-discovery-v18.0.11.json"
            echo '```'
          } > "$GITHUB_WORKSPACE/dist-evidence/mri-discovery/omp-discovery-v18.0.11.md"
      - name: Assemble release candidate from peeled tag checkout
        run: node scripts/create-release-candidate.mjs --tag "$TAG" --output dist-candidate

      - name: Verify candidate public safety
        run: node scripts/verify-public-tree.mjs --candidate dist-candidate/candidate.json --output dist-candidate/public-safety.json
      - name: Smoke the exact release archive with unset environment
        run: |
          archive="$(node -p "require('./dist-candidate/candidate.json').archive.file")"
          node scripts/smoke-release-archive.mjs --archive "dist-candidate/$archive"
      - name: Smoke explicit safe-authoring compatibility stage
        run: |
          archive="$(node -p "require('./dist-candidate/candidate.json').archive.file")"
          node scripts/smoke-release-archive.mjs --archive "dist-candidate/$archive" --stage safe-authoring
      - name: Capture the real corpus inventory via the kernel reader
        run: node scripts/create-corpus-inventory.mjs --output dist-candidate/corpus-inventory.json
      - name: Extract the real v0.3.2 prior release for lifecycle producers
        run: node scripts/lifecycle/build-tagged-candidate.mjs --tag v0.3.2 --output dist-evidence/prior
      - name: Run install/reload/fresh-session/inventory lifecycle producer
        env:
          LIFECYCLE_PROJECT_DIR: ${{ runner.temp }}/omp-lifecycle-fr4
          LIFECYCLE_HOME: ${{ runner.temp }}/omp-lifecycle-home
          LIFECYCLE_AGENT_DIR: ${{ runner.temp }}/omp-lifecycle-agent
        run: |
          mkdir -p "$LIFECYCLE_PROJECT_DIR/.specs" "$LIFECYCLE_HOME" "$LIFECYCLE_AGENT_DIR"
          cp -r tests/fixtures/kernel/authoring-real-corpus/.specs/. "$LIFECYCLE_PROJECT_DIR/.specs/"
          cd "$LIFECYCLE_PROJECT_DIR" && HOME="$LIFECYCLE_HOME" USERPROFILE="$LIFECYCLE_HOME" PI_CONFIG_DIR=.omp-lifecycle-producer OMP_PROFILE=lifecycle-producer \
            bun "$GITHUB_WORKSPACE/scripts/lifecycle/run-lifecycle-install-reload-fresh-session.mjs" \
            --runtime-root "$GITHUB_WORKSPACE/tests/fixtures/omp-discovery-runtime/node_modules/@oh-my-pi/pi-coding-agent" \
            --candidate-package-root "$GITHUB_WORKSPACE/plugins/omp-spec-kit" \
            --project-dir "$LIFECYCLE_PROJECT_DIR" \
            --receipts-out "$GITHUB_WORKSPACE/dist-evidence/receipts/lifecycle" \
            --expected-version "${TAG#v}" \
            --phase-timeout-ms 30000
      - name: Extract v0.3.2 prior and run upgrade lifecycle producer
        timeout-minutes: 20
        env:
          LIFECYCLE_PROJECT_DIR: ${{ runner.temp }}/omp-lifecycle-upgrade
          LIFECYCLE_HOME: ${{ runner.temp }}/omp-upgrade-home
          LIFECYCLE_AGENT_DIR: ${{ runner.temp }}/omp-upgrade-agent
        run: |
          # Reuse the single v0.3.2 extraction from dist-evidence/prior.
          mkdir -p "$LIFECYCLE_PROJECT_DIR/.specs" "$LIFECYCLE_HOME" "$LIFECYCLE_AGENT_DIR"
          cp -r tests/fixtures/kernel/authoring-real-corpus/.specs/. "$LIFECYCLE_PROJECT_DIR/.specs/"
          cd "$LIFECYCLE_PROJECT_DIR" && HOME="$LIFECYCLE_HOME" USERPROFILE="$LIFECYCLE_HOME" PI_CONFIG_DIR=.omp-lifecycle-producer OMP_PROFILE=lifecycle-producer \
            bun "$GITHUB_WORKSPACE/scripts/lifecycle/run-lifecycle-upgrade.mjs" \
            --runtime-root "$GITHUB_WORKSPACE/tests/fixtures/omp-discovery-runtime/node_modules/@oh-my-pi/pi-coding-agent" \
            --candidate-package-root "$GITHUB_WORKSPACE/plugins/omp-spec-kit" \
            --prior-package-root "$GITHUB_WORKSPACE/dist-evidence/prior" \
            --project-dir "$LIFECYCLE_PROJECT_DIR" \
            --receipts-out "$GITHUB_WORKSPACE/dist-evidence/receipts/lifecycle" \
            --expected-version "${TAG#v}" \
            --prior-version 0.3.2 \
            --phase-timeout-ms 120000

      - name: Run uninstall/reinstall/rollback lifecycle producer
        env:
          LIFECYCLE_PROJECT_DIR: ${{ runner.temp }}/omp-lifecycle-fr8
          LIFECYCLE_HOME: ${{ runner.temp }}/omp-fr8-home
          LIFECYCLE_AGENT_DIR: ${{ runner.temp }}/omp-fr8-agent
        run: |
          mkdir -p "$LIFECYCLE_PROJECT_DIR/.specs" "$LIFECYCLE_HOME" "$LIFECYCLE_AGENT_DIR"
          cp -r tests/fixtures/kernel/authoring-real-corpus/.specs/. "$LIFECYCLE_PROJECT_DIR/.specs/"
          cd "$LIFECYCLE_PROJECT_DIR" && HOME="$LIFECYCLE_HOME" USERPROFILE="$LIFECYCLE_HOME" PI_CONFIG_DIR=.omp-lifecycle-producer OMP_PROFILE=lifecycle-producer \
            bun "$GITHUB_WORKSPACE/scripts/lifecycle/run-lifecycle-uninstall-reinstall.mjs" \
            --runtime-root "$GITHUB_WORKSPACE/tests/fixtures/omp-discovery-runtime/node_modules/@oh-my-pi/pi-coding-agent" \
            --candidate-package-root "$GITHUB_WORKSPACE/plugins/omp-spec-kit" \
            --project-dir "$LIFECYCLE_PROJECT_DIR" \
            --receipts-out "$GITHUB_WORKSPACE/dist-evidence/receipts/lifecycle" \
            --expected-version "${TAG#v}" \
            --rollback-to-prior-package-root "$GITHUB_WORKSPACE/dist-evidence/prior" \
            --prior-version 0.3.2 \
            --phase-timeout-ms 120000

      # Release-grade MRI receipts must cite semantic Cucumber evidence from
      # THIS checkout, so capture the canonical Messages stream the same way
      # the release verify job does instead of trusting any stale fixture.
      # v0.5.0 smoke runs before lifecycle composition.
      - name: Run v0.5.0 safe-authoring BDD and OMP manager E2E
        run: npm run test:safe-authoring
      - name: Run v0.5.0 release-integrity BDD
        run: npm run test:release-integrity
      - name: Run Docker BDD and preserve semantic Cucumber messages
        run: |
          set -o pipefail
          mkdir -p .omp-spec-kit/evidence/bdd-results
          OMP_SPEC_KIT_BDD_MESSAGE_STDOUT=1 bash scripts/docker-bdd.sh > dist-candidate/cucumber.ndjson

      # Composes the nine closed MRI lifecycle receipts pipeline-time from the
      # real runner outputs above plus the v0.3.2 peeled tag commit; fail-closed.
      - name: Compose nine MRI lifecycle receipts from real producer outputs
        run: |
          node scripts/compose-mri-lifecycle-receipts.mjs \
            --candidate dist-candidate/candidate.json \
            --prior-commit "$(git rev-parse v0.3.2^{commit})" \
            --runner-dir dist-evidence/receipts/lifecycle \
            --cucumber-messages dist-candidate/cucumber.ndjson \
            --output dist-evidence/mri-receipts

      - name: Build attested distribution evidence bundle
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          # Bound the MRI discovery artifact by digest, exactly as
          # create-release-evidence copies it and verify-release checks it.
          DISCOVERY_SHA="$(sha256sum dist-evidence/mri-discovery/omp-discovery-v18.0.11.md | cut -d ' ' -f1)"
          node scripts/create-distribution-evidence.mjs \
            --candidate dist-candidate/candidate.json \
            --public-safety dist-candidate/public-safety.json \
            --marketplace-marker "$GITHUB_WORKSPACE/.omp-spec-kit-marketplace-ok" \
            --package-marker "$GITHUB_WORKSPACE/.omp-spec-kit-package-ok" \
            --dist-manifest "$GITHUB_WORKSPACE/plugins/omp-spec-kit/dist/manifest.json" \
            --catalog "$GITHUB_WORKSPACE/.omp-plugin/marketplace.json" \
            --package-manifest "$GITHUB_WORKSPACE/plugins/omp-spec-kit/package.json" \
            --inventory-output dist-candidate/corpus-inventory.json \
            --mri-discovery-digest "$DISCOVERY_SHA" \
            --lifecycle-receipts-dir dist-evidence/receipts/lifecycle \
            --cucumber-messages dist-candidate/cucumber.ndjson \
            --output dist-evidence

      - name: Attest the distribution evidence bundle
        uses: actions/attest@v4
        with:
          subject-path: dist-evidence/distribution-evidence.json

      - uses: actions/upload-artifact@v4
        with:
          name: omp-spec-kit-distribution-evidence-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          path: |
            dist-evidence/distribution-evidence.json
            dist-evidence/mri-receipts/
            dist-evidence/mri-discovery/
            dist-evidence/receipts/
          if-no-files-found: error
