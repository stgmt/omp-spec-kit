name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    # Least privilege: the job token exists only so `gh` can list and download
    # workflow runs of this repository during evidence discovery.
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install the pinned OMP discovery runtime
        run: cd tests/fixtures/omp-discovery-runtime && bun install --frozen-lockfile --ignore-scripts --no-progress
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify frozen corpus provenance before release execution
        run: |
          node scripts/refresh-real-corpus-manifest.mjs --check
          node scripts/refresh-authoring-real-corpus-manifest.mjs --check
      - run: npm run build
      - run: npm run verify
      - name: Assemble candidate from peeled tag checkout
        run: node scripts/create-release-candidate.mjs --tag "$GITHUB_REF_NAME" --output release-candidate
      - name: Verify candidate public safety
        run: node scripts/verify-public-tree.mjs --candidate release-candidate/candidate.json --output release-candidate/public-safety.json
      - name: Smoke the exact release archive with unset environment
        run: |
          archive="$(node -p "require('./release-candidate/candidate.json').archive.file")"
          node scripts/smoke-release-archive.mjs --archive "release-candidate/$archive"
      - run: mkdir -p .omp-spec-kit/evidence/bdd-results
      - name: Run safe-authoring BDD and OMP manager E2E
        run: npm run test:safe-authoring
      - name: Run release-integrity BDD
        run: npm run test:release-integrity
      - name: Run Docker BDD and preserve canonical Cucumber messages
        run: |
          set -o pipefail
          OMP_SPEC_KIT_BDD_MESSAGE_STDOUT=1 bash scripts/docker-bdd.sh > release-candidate/cucumber.ndjson
      - name: Download commit-bound attested distribution evidence when present
        id: dist_evidence
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Resolve the peeled tag commit so workflow_dispatch runs (whose
          # headBranch is not the tag) are discoverable, and select only a
          # successful run whose headSha IS that commit — never a stale
          # artifact left over from an earlier tag of the same name.
          COMMIT="$(git rev-parse "$TAG^{commit}")"
          run_id=""
          for attempt in $(seq 1 30); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow distribution-evidence.yml \
              --limit 50 \
              --json databaseId,headSha,status,conclusion \
              --jq ".[] | select(.conclusion == \"success\" and .headSha == \"$COMMIT\") | .databaseId" \
              | head -n 1 || true)"
            if [ -n "$run_id" ]; then break; fi
            if [ "$attempt" -lt 30 ]; then sleep 10; fi
          done
          identity_ok=""
          if [ -n "$run_id" ]; then
            mkdir dist-evidence
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --name "omp-spec-kit-distribution-evidence-$TAG" --dir dist-evidence
            gh attestation verify dist-evidence/distribution-evidence.json --repo "$GITHUB_REPOSITORY" --format json > dist-evidence/attestation.json
            test -s dist-evidence/attestation.json
            # The pipeline-time composed MRI receipts live beside the bundle;
            # the assembler copies them instead of pre-tag-committed files.
            if [ -d dist-evidence/mri-receipts ]; then
              echo "lifecycle_dir=dist-evidence/mri-receipts" >> "$GITHUB_OUTPUT"
            else
              echo "::error::attested distribution evidence artifact is missing dist-evidence/mri-receipts; refusing pre-tag-committed receipts" >&2
            fi
            if [ ! -f dist-evidence/mri-discovery/omp-discovery-v18.0.11.md ]; then
              echo "::error::attested distribution evidence artifact is missing the live OMP discovery receipt" >&2
              identity_ok=""
            fi
            downloaded="$(node -p "JSON.parse(require('fs').readFileSync('dist-evidence/distribution-evidence.json','utf8')).candidateDigest")"
            expected="$(node -p "require('./release-candidate/candidate.json').candidateDigest")"
            if [ -n "$downloaded" ] && [ "$downloaded" = "$expected" ]; then
              identity_ok=1
            else
              echo "::error::downloaded distribution evidence candidateDigest does not match this release candidate" >&2
            fi
          else
            echo "No successful distribution-evidence run for commit $COMMIT; staying on the blocked untrusted path." >&2
          fi
          if [ "$identity_ok" = "1" ]; then
            echo "path=dist-evidence/distribution-evidence.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Assemble MRI evidence; trust is stamped only on a digest-matched bundle from this commit
        run: |
          # Receipts come from the attested distribution-evidence artifact
          # (composed pipeline-time); a missing download fails closed below
          # instead of falling back to pre-tag-committed files.
          LIFECYCLE_DIR="${{ steps.dist_evidence.outputs.lifecycle_dir }}"
          if [ -z "$LIFECYCLE_DIR" ] || [ ! -d "$LIFECYCLE_DIR" ]; then
            echo "::error::no pipeline-time MRI lifecycle receipts available; evidence assembly refuses to proceed" >&2
            exit 1
          fi
          if [ -f "${{ steps.dist_evidence.outputs.path || 'dist-evidence/absent' }}" ]; then
            node scripts/create-release-evidence.mjs \
              --candidate release-candidate/candidate.json \
              --public-safety release-candidate/public-safety.json \
              --cucumber-messages release-candidate/cucumber.ndjson \
              --lifecycle-dir "$LIFECYCLE_DIR" \
              --mri-discovery dist-evidence/mri-discovery/omp-discovery-v18.0.11.md \
              --distribution-evidence dist-evidence/distribution-evidence.json \
              --distribution-trust github-artifact-attestation \
              --output release-candidate
          else
            node scripts/create-release-evidence.mjs \
              --candidate release-candidate/candidate.json \
              --public-safety release-candidate/public-safety.json \
              --cucumber-messages release-candidate/cucumber.ndjson \
              --lifecycle-dir "$LIFECYCLE_DIR" \
              --mri-discovery dist-evidence/mri-discovery/omp-discovery-v18.0.11.md \
              --output release-candidate
          fi

      - name: Enforce producer-artifact claim matrix before notes or candidate upload
        run: node scripts/verify-release.mjs --candidate release-candidate/candidate.json --evidence release-candidate/evidence.json --tag "$GITHUB_REF_NAME"
      - name: Render evidence-bound release notes
        run: node scripts/render-release-notes.mjs --candidate release-candidate/candidate.json --evidence release-candidate/evidence.json --tag "$GITHUB_REF_NAME" --output release-candidate/release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: omp-spec-kit-release-candidate-${{ github.ref_name }}
          path: release-candidate
          if-no-files-found: error

  publish:
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    needs: verify
    runs-on: ubuntu-latest
    # Least privilege: the job token exists only so `gh` can reverify and
    # create the GitHub release for this repository.
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: omp-spec-kit-release-candidate-${{ github.ref_name }}
          path: release-candidate
      - name: Reverify downloaded candidate without rebuilding
        run: node scripts/verify-release.mjs --candidate release-candidate/candidate.json --evidence release-candidate/evidence.json --tag "$GITHUB_REF_NAME"
      - name: Publish only matching candidate assets
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          archive="$(node -p "require('./release-candidate/candidate.json').archive.file")"
          expected_sha="$(node -p "require('./release-candidate/candidate.json').archive.sha256")"
          expected_commit="$(node -p "require('./release-candidate/candidate.json').commit")"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_commit="$(git rev-parse "$TAG^{commit}")"
            if [ "$existing_commit" != "$expected_commit" ]; then
              echo "::error::existing release commit differs from verified candidate"
              exit 1
            fi
            mkdir existing-assets
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$archive" --dir existing-assets
            actual_sha="$(sha256sum "existing-assets/$archive" | cut -d ' ' -f1)"
            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "::error::existing release archive differs from verified candidate"
              exit 1
            fi
            echo "created=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "omp-spec-kit $TAG" \
            --notes-file release-candidate/release-notes.md \
            "release-candidate/$archive" \
            release-candidate/candidate.json \
            release-candidate/evidence.json
          echo "created=1" >> "$GITHUB_OUTPUT"
      - name: Attest published release assets
        if: steps.publish.outputs.created == '1'
        uses: actions/attest@v4
        with:
          subject-path: |
            release-candidate/${{ steps.publish.outputs.archive }}
            release-candidate/candidate.json
            release-candidate/evidence.json
