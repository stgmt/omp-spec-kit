name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run verify
      - name: Assemble candidate from peeled tag checkout
        run: node scripts/create-release-candidate.mjs --tag "$GITHUB_REF_NAME" --output release-candidate
      - name: Verify candidate public safety
        run: node scripts/verify-public-tree.mjs --candidate release-candidate/candidate.json --output release-candidate/public-safety.json
      - name: Run Docker BDD and preserve canonical Cucumber messages
        run: |
          set -o pipefail
          OMP_SPEC_KIT_BDD_MESSAGE_STDOUT=1 bash scripts/docker-bdd.sh > release-candidate/cucumber.ndjson
      - name: Assemble candidate evidence
        run: |
          node scripts/create-release-evidence.mjs \
            --candidate release-candidate/candidate.json \
            --public-safety release-candidate/public-safety.json \
            --cucumber-messages release-candidate/cucumber.ndjson \
            --lifecycle-dir "docs/validation/releases/${GITHUB_REF_NAME}" \
            --output release-candidate
      - name: Evaluate release eligibility
        run: node scripts/verify-release.mjs --candidate release-candidate/candidate.json --evidence release-candidate/evidence.json --tag "$GITHUB_REF_NAME"
      - name: Render evidence-bound release notes
        run: node scripts/render-release-notes.mjs --candidate release-candidate/candidate.json --evidence release-candidate/evidence.json --tag "$GITHUB_REF_NAME" --output release-candidate/release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: omp-spec-kit-release-candidate-${{ github.ref_name }}
          path: release-candidate
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: omp-spec-kit-release-candidate-${{ github.ref_name }}
          path: release-candidate
      - name: Reverify downloaded candidate without rebuilding
        run: node scripts/verify-release.mjs --candidate release-candidate/candidate.json --evidence release-candidate/evidence.json --tag "$GITHUB_REF_NAME"
      - name: Publish only matching candidate assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          archive="$(node -p "require('./release-candidate/candidate.json').archive.file")"
          expected_sha="$(node -p "require('./release-candidate/candidate.json').archive.sha256")"
          expected_commit="$(node -p "require('./release-candidate/candidate.json').commit")"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_commit="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
            if [ "$existing_commit" != "$expected_commit" ]; then
              echo "::error::existing release commit differs from verified candidate"
              exit 1
            fi
            mkdir existing-assets
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$archive" --dir existing-assets
            actual_sha="$(sha256sum "existing-assets/$archive" | cut -d ' ' -f1)"
            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "::error::existing release archive differs from verified candidate"
              exit 1
            fi
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "omp-spec-kit $TAG" \
            --notes-file release-candidate/release-notes.md \
            "release-candidate/$archive" \
            release-candidate/candidate.json \
            release-candidate/evidence.json
