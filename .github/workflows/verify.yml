name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specs-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Root-level .specs/ must not be tracked on code branches
        run: |
          if git ls-files --error-unmatch '.specs/*' >/dev/null 2>&1; then
            echo "::error::root-level .specs/ is tracked on a non-specs branch — canonical specs live only on the 'specs' branch"
            git ls-files .specs
            exit 1
          fi
          echo "clean: no tracked .specs/ on this branch"

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out canonical specs (specs branch)
        uses: actions/checkout@v4
        with:
          ref: specs
          path: .specs-worktree
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run verify
      - run: npm run test:unit

  bdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Docker BDD (Docker-only suite)
        run: bash scripts/docker-bdd.sh

  candidate-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: node scripts/check-candidate-portability.mjs --capture candidate-portability.json
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-portability-${{ matrix.os }}
          path: candidate-portability.json

  candidate-portability-compare:
    needs: candidate-portability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-portability-*
          path: candidate-portability
      - run: node scripts/check-candidate-portability.mjs --compare candidate-portability/candidate-portability-windows-latest/candidate-portability.json candidate-portability/candidate-portability-ubuntu-latest/candidate-portability.json