name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run verify
      - name: Release consistency gate
        run: node scripts/verify-release.mjs
        env:
          RELEASE_TAG: v$(node -p "require('./plugins/omp-spec-kit/package.json').version")
          RELEASE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

  bdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Docker BDD (Docker-only suite)
        run: bash scripts/docker-bdd.sh
