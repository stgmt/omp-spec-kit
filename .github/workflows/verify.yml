name: verify

on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run verify
      - run: npm run test:unit
      - name: YouTrack app package artifact
        uses: actions/upload-artifact@v4
        with:
          name: spec-graph-app
          if-no-files-found: error
          path: |
            dist/spec-graph-app/
            dist/spec-graph-app-*.zip

  service:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      # Several publish tests create real annotated tags; the runner has no
      # ambient identity.
      - run: git config --global user.name "spec-registryd CI"
      - run: git config --global user.email "bot@spec-registryd.invalid"
      # The service suite authenticates against a real YouTrack. Bootstrap the
      # live contour (service + YouTrack + git daemon) without the app so the
      # bootstrap never depends on the browser upload path.
      - name: Bootstrap the live contour
        run: |
          node tests/e2e/run-live.mjs --bootstrap-only --skip-app || {
            echo "first bootstrap failed; retrying after YouTrack warm-up"
            sleep 60
            node tests/e2e/run-live.mjs --bootstrap-only --skip-app
          }
      - run: npm run test:service
      - name: Tear down the live contour
        if: always()
        run: docker compose -p spec-auth-e2e -f tests/e2e/compose.yml down -v

  bdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Docker BDD (Docker-only suite)
        run: bash scripts/docker-bdd.sh

  candidate-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: node scripts/check-candidate-portability.mjs --capture candidate-portability.json
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-portability-${{ matrix.os }}
          path: candidate-portability.json

  candidate-portability-compare:
    needs: candidate-portability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-portability-*
          path: candidate-portability
      - run: node scripts/check-candidate-portability.mjs --compare candidate-portability/candidate-portability-windows-latest/candidate-portability.json candidate-portability/candidate-portability-ubuntu-latest/candidate-portability.json